workflow:
  auto_cancel:
    on_new_commit: conservative

stages:
  - test
  - release
  - deploy

default:
  image: "${ARTIFACTORY_SERVER}/sds/sdd-common-ci:2026.10.0@sha256:4dbef76cae6000a9fed4636a748d6411a7c0959e2f9e5562090eaec572f74c26"

include:
  - project: 'sds-dev/releases'
    ref: main
    file: 'releases.yml'

backend-lint:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  before_script:
    - pip install pre-commit tox mypy .[dev]
  script:
    - SKIP=no-commit-to-branch pre-commit run --all-files -c .pre-commit-config.yaml --show-diff-on-failure --color never
    - tox -e bandit

spellcheck:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  before_script:
    - pip install pyspelling
  script:
    - pyspelling

frontend-lint:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  before_script:
    - pnpm --prefix swift_browser_ui_frontend install
  script:
    - pnpm --prefix swift_browser_ui_frontend lint

backend-test:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  before_script:
    - pnpm --prefix swift_browser_ui_frontend install --prod
    - pip install .[test]
  script:
    - pnpm --prefix swift_browser_ui_frontend docker-build
    - tox -e pytest
    - coverage run -m pytest tests/
    - coverage report --precision=1
  coverage: '/TOTAL.*\s+(\d+\%)/'

wasm-test:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  before_script:
    - ruby --version
    - gem --version
    - gem install ceedling --no-document
  script:
    - cd swift_browser_ui_frontend/wasm
    - ceedling --verbosity debug

# This job creates the automated releases
release-job:
  extends: .automated-release
  interruptible: true
  release:
    description: $(cat release_changes.md)
    assets:
      links:
        - name: ${ARTIFACTORY_SERVER}/sds/sd-connect:${RELEASE_VERSION}
          url: https://${ARTIFACTORY_SERVER}/sds/sd-connect:${RELEASE_VERSION}
          link_type: image
        - name: ${ARTIFACTORY_SERVER}/sds/swiftui-upload-runner:${RELEASE_VERSION}
          url: https://${ARTIFACTORY_SERVER}/sds/swiftui-upload-runner:${RELEASE_VERSION}
          link_type: image
        - name: ${ARTIFACTORY_SERVER}/sds/swift-x-account-sharing:${RELEASE_VERSION}
          url: https://${ARTIFACTORY_SERVER}/sds/swift-x-account-sharing:${RELEASE_VERSION}
          link_type: image
        - name: ${ARTIFACTORY_SERVER}/sds/swift-sharing-request:${RELEASE_VERSION}
          url: https://${ARTIFACTORY_SERVER}/sds/swift-sharing-request:${RELEASE_VERSION}
          link_type: image

# This is a manual dry-run for developers to run in the merge request
update-versions-dryrun:
  extends: .update-versions-dryrun
  interruptible: true
  variables:
    UPDATE_VERSION_FILES_LIST: "openapi.yaml;swift_browser_ui/__init__.py;swift_browser_ui_frontend/package.json"
    VERSION_UPDATE_INDICATOR: "version"

# This job updates the versions
update-versions:
  extends: .update-versions
  variables:
    UPDATE_VERSION_FILES_LIST: "openapi.yaml;swift_browser_ui/__init__.py;swift_browser_ui_frontend/package.json"
    VERSION_UPDATE_INDICATOR: "version"

# Trigger build pipelines downstream
deploy:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        DEPLOY_TAG: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        BUILD_DEPLOYMENT: "false"
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
      variables:
        DEPLOY_TAG: $CI_COMMIT_TAG
        BUILD_DEPLOYMENT: "true"
  stage: deploy
  trigger:
    project: sds-dev/sd-connect/swift-ui-csc-deployment
    branch: main
    strategy: depend
    inputs:
      build_tag: $DEPLOY_TAG
      build_deployment: $BUILD_DEPLOYMENT
